# Builds open-source HTML5 games that need a build step, on GitHub's throwaway runners (never on a personal machine).
# Input: JSON list of {"url","branch","slug"}. Output: one artifact per game with the static build + the licence.
name: build-games
on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'JSON list of {"url","branch","slug"}'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        repo: ${{ fromJSON(github.event.inputs.repos) }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build ${{ matrix.repo.slug }}
        env:
          URL: ${{ matrix.repo.url }}
          BRANCH: ${{ matrix.repo.branch }}
          SLUG: ${{ matrix.repo.slug }}
          PUBLIC_URL: .
          CI: "false"
        run: |
          set -u
          git clone -q --depth 1 -b "$BRANCH" "$URL" src && cd src
          if [ -f pnpm-lock.yaml ]; then npx -y pnpm@9 install --no-frozen-lockfile || exit 1
          elif [ -f yarn.lock ]; then npx -y yarn@1 install --ignore-engines || exit 1
          else npm install --no-audit --no-fund --loglevel=error || exit 1; fi
          if grep -q '"vite"' package.json; then npx vite build --base=./ || npm run build
          elif grep -q '"parcel' package.json && ! grep -q '"build"' package.json; then npx parcel build index.html --public-url ./ --dist-dir dist
          else npm run build; fi
          OUT=""
          for d in dist build out public docs www; do
            if [ -f "$d/index.html" ] && [ -n "$(find "$d" -newer package.json -type f | head -1)" ]; then OUT="$d"; break; fi
          done
          [ -z "$OUT" ] && for d in dist build out; do [ -f "$d/index.html" ] && OUT="$d" && break; done
          [ -z "$OUT" ] && { echo "no build output with index.html"; exit 1; }
          # root-absolute asset paths break when the game is served from a sub-folder
          if grep -Eq '(src|href)="/[^/]' "$OUT/index.html"; then echo "absolute asset paths in $OUT/index.html"; exit 1; fi
          SIZE=$(du -sm "$OUT" | cut -f1); [ "$SIZE" -gt 40 ] && { echo "too big: ${SIZE}MB"; exit 1; }
          mkdir -p ../artifact/__build && cp -R "$OUT"/. ../artifact/__build/
          for f in LICENSE* LICENCE* COPYING* UNLICENSE* license* licence*; do [ -f "$f" ] && cp "$f" ../artifact/; done
          echo "{\"slug\":\"$SLUG\",\"out\":\"$OUT\",\"mb\":$SIZE}" > ../artifact/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo.slug }}
          path: artifact
          retention-days: 3
